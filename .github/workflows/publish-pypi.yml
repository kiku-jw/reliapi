name: Publish PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check PYPI_TOKEN
        id: check-token
        run: |
          if [ -z "${{ secrets.PYPI_TOKEN }}" ]; then
            echo "PYPI_TOKEN not set, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Set up Java
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        if: steps.check-token.outputs.skip != 'true'
        run: |
          pip install -r requirements-dev.txt
          pip install --upgrade build "twine>=5.0.0"

      - name: Generate OpenAPI
        if: steps.check-token.outputs.skip != 'true'
        run: python scripts/generate_openapi.py

      - name: Generate Python SDK
        if: steps.check-token.outputs.skip != 'true'
        run: |
          npm install -g @openapitools/openapi-generator-cli || true
          bash scripts/generate_sdk.sh python

      - name: Build SDK
        if: steps.check-token.outputs.skip != 'true'
        working-directory: sdk/python
        run: python -m build

      - name: Publish to PyPI
        if: steps.check-token.outputs.skip != 'true'
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Skip notice
        if: steps.check-token.outputs.skip == 'true'
        run: echo "::notice::PyPI publish skipped - PYPI_TOKEN not configured"
