version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/cli"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3
    groups:
      cli-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/action"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3
    groups:
      action-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
